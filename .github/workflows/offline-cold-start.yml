name: Installed PWA cold offline boot
on:
  push:
    branches:
      - staging
      - release/7.9.12-rc1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build actual installable static PWA
        run: python scripts/build_pages.py
      - name: Install Chromium browser for real Service Worker test
        run: |
          python -m pip install -q playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Open installed PWA online, disconnect, close and relaunch offline
        run: python tests/offline_pwa_browser.py
      - name: Confirm internal PWA pages online and offline
        run: python tests/internal_pages_browser.py
      - name: Android-first mobile PWA navigation, touch gestures, dark themes and narrow screens
        run: python tests/android_pwa_browser.py
      - name: Confirm dark theme contrast and iPhone dock in real Chromium
        run: python tests/theme_browser.py
      - name: Audit dark panels and text contrast on every linked page
        run: python tests/dark_secondary_pages_browser.py
      - name: Test Inbox controls and iOS scaling prevention in Chromium
        run: python tests/inbox_toolbar_browser.py
      - name: Test Svitlo Office admin in real Chromium with mock backend
        run: python tests/admin_office_browser.py
