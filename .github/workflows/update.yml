name: Automatic schedule and queue data update
on:
  schedule:
    - cron: '7,37 * * * *' # GitHub Actions may run later under load.
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_data.py'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: svitlo-data-refresh
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download new blackout schedules
        run: python scripts/update_data.py --schedules-only
      - name: Download address-to-queue index (best effort)
        run: python scripts/update_data.py --addresses-only || echo "Official PDFs could not be fully parsed today; schedule updates can still continue"
      - name: Commit verified updates
        run: |
          git config user.name "svitlo-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedules.json data/addresses.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public outage schedules and official addresses"
            git push
          fi
