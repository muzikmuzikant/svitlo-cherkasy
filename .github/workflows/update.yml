name: Update official blackout data
on:
  workflow_dispatch:
  schedule:
    # Run every 5 minutes, all day (UTC). GitHub Actions can be delayed.
    - cron: '2-57/5 * * * *'
  push:
    paths:
      - 'scripts/update_data.py'
      - 'scripts/publish_gate.py'
      - 'release.json'
      - '.github/workflows/update.yml'
permissions:
  contents: write
concurrency:
  group: svitlo-data-refresh
  cancel-in-progress: false
jobs:
  schedules:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Validate parser before fetching
        run: python -m pytest -q tests/test_date_integrity.py tests/test_schedule_resilience.py tests/test_frequent_edits_v714.py tests/test_reliability_v720.py
      - name: Import official schedules
        id: schedule
        run: python scripts/update_data.py --schedules-only
      - name: Show import diagnostics
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for filename in ('schedules', 'source_review'):
              p = Path('data') / (filename + '.json')
              if not p.exists():
                  print(filename, 'missing')
                  continue
              data = json.loads(p.read_text(encoding='utf-8'))
              print(filename, 'lastChecked=', data.get('lastChecked'),
                    'days=', [day['date'] for day in data.get('days', [])],
                    'reviewPending=', data.get('reviewPending'),
                    'warnings=', data.get('warningCount'),
                    'rejected=', data.get('rejectedCount'))
          PY
      - name: Decide whether a site deployment is needed
        id: gate
        run: python scripts/publish_gate.py >> "$GITHUB_OUTPUT"
      - name: Commit verified schedules
        if: steps.schedule.outcome == 'success' && steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "svitlo-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedules.json data/source_review.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified outage schedules"
            git pull --rebase origin main
            git push origin HEAD:main
            # GitHub-token commits do NOT themselves trigger the Pages workflow.
            gh api repos/${{ github.repository }}/dispatches -f event_type=svitlo-data-updated
          fi
