name: Release candidate 7.9.12 checks
on:
  push:
    branches: ['release/7.9.12-rc1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate production identity, isolation and release metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          rel=json.loads(Path('release.json').read_text())
          push=json.loads(Path('push-config.json').read_text())
          manifest=json.loads(Path('manifest.webmanifest').read_text())
          html=Path('index.html').read_text()
          assert rel['version']=='7.9.12' and rel['channel']=='production'
          assert manifest['id']=='./', 'Keep existing PWA identity'
          assert 'svitlo-cherkasy-production.up.railway.app' in push['apiBase']
          assert 'svitlo-beta-api' not in push['apiBase']
          assert 'data-deployment-channel="production"' in html
          assert 'id="stagingBadge"' not in html
          assert 'svitlo-cherkasy.pages.dev' not in html
          assert Path('CNAME').read_text().strip()=='svitlo-cherkasy.pp.ua'
          print('Production identity and Push settings preserved')
          PY
      - name: Check JavaScript syntax
        run: |
          find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
          find push-server -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Full Node tests
        run: node --test tests/*.cjs tests/*.mjs
      - name: Full Python tests
        run: |
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q tests
      - name: Create Production web artifact without deploying
        run: |
          python scripts/build_pages.py
          python - <<'PY'
          from pathlib import Path
          import json
          assert not Path('_site/index.html').read_text().find('id="stagingBadge"')>=0
          assert '-beta-' not in Path('_site/sw.js').read_text()
          assert Path('_site/CNAME').read_text().strip()=='svitlo-cherkasy.pp.ua'
          assert json.loads(Path('_site/release.json').read_text())['channel']=='production'
          print('Release site built, no publishing action')
          PY
