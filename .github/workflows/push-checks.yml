name: Push Delivery Regression Checks
on:
  push:
    branches: [main]
    paths:
      - 'push-server/**'
      - 'app.js'
      - 'sw.js'
      - 'index.html'
      - 'tests/test_push_delivery_health.mjs'
      - 'tests/test_share_application_beta.mjs'
      - 'tests/test_schedule_engine.mjs'
      - 'tests/test_transition_server_dispatch.mjs'
      - 'tests/test_transition_dispatcher.mjs'
      - 'tests/test_transition_inbox.mjs'
      - 'tests/test_push_publication_reliability.mjs'
      - '.github/workflows/push-checks.yml'
  pull_request:
    branches: [staging, main]
    paths:
      - 'push-server/**'
      - 'app.js'
      - 'sw.js'
      - 'index.html'
      - 'tests/test_push_delivery_health.mjs'
      - 'tests/test_share_application_beta.mjs'
      - 'tests/test_schedule_engine.mjs'
      - 'tests/test_transition_server_dispatch.mjs'
      - 'tests/test_transition_dispatcher.mjs'
      - 'tests/test_transition_inbox.mjs'
      - 'tests/test_push_publication_reliability.mjs'
      - '.github/workflows/push-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  push-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server and client syntax
        run: node --check push-server/server.js && node --check app.js && node --check sw.js
      - name: Run real Push regression checks
        run: node --test tests/test_share_application_beta.mjs tests/test_push_delivery_health.mjs tests/test_schedule_engine.mjs tests/test_transition_inbox.mjs tests/test_auto_notifications.mjs tests/test_transition_server_dispatch.mjs tests/test_transition_dispatcher.mjs tests/test_push_publication_reliability.mjs
