name: Refresh official address queues for Beta
on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/refresh-address-queues-staging.yml
      - scripts/update_data.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: svitlo-staging-address-queues
  cancel-in-progress: false
jobs:
  addresses:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: Verify official address parsing and queue safety
        run: python -m pytest -q tests/test_district_import.py tests/test_published_fallback.py tests/test_address_catalog_v793.py tests/test_official_pdf_full_coverage.py
      - name: Import all official district queue PDFs
        run: python scripts/update_data.py --addresses-only
      - name: Report official PDF coverage and audit integrity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('data/address_audit.json').read_text('utf8'))
          assert len(a['sourceFiles'])==12
          assert set(x['queue'] for x in a['sourceFiles'])=={f'{i}.{j}' for i in range(1,7) for j in (1,2)}
          for x in a['sourceFiles']:
              assert x['pages']>0 and len(x['sha256'])==64
              print(x['queue'],x['pages'],'pages,',x['cityHouseMentions'],'city house mentions,',x['districtStreetMentions'],'district street hints')
          print('TOTALS:',a['totals'])
          PY
      - name: Report address coverage of every locality
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/addresses.json').read_text(encoding='utf-8'))
          print('Cherkasy:',len(d.get('streets',{})),'streets,',len(d.get('keys',{})),'houses')
          for town,record in sorted(d.get('localities',{}).items()):
              print(town,len(record.get('streets',{})),'streets,',len(record.get('keys',{})),'houses')
          print('Statistics:',d.get('stats',{}))
          PY
      - name: Commit validated beta address index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "svitlo-beta-address-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/addresses.json data/address_audit.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh complete verified Beta address lists"
            git pull --rebase origin staging
            git push origin HEAD:staging
          fi
