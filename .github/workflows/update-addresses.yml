name: Refresh official address queues
on:
  workflow_dispatch:
  schedule:
    # Daily address source check. Only verified changes are committed.
    - cron: '17 3 * * *'
permissions:
  contents: write
concurrency:
  group: svitlo-data-refresh
  cancel-in-progress: false
jobs:
  addresses:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Validate address parser and safety guards
        run: python -m pytest -q tests/test_district_import.py tests/test_published_fallback.py
      - name: Refresh official PDF address lists
        run: python scripts/update_data.py --addresses-only
      - name: Commit verified addresses
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "svitlo-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/addresses.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified address queue lists"
            git pull --rebase origin main
            git push origin HEAD:main
            gh api repos/${{ github.repository }}/dispatches -f event_type=svitlo-data-updated
          fi
