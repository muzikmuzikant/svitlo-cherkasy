name: Office PWA Production Release QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'admin-app/**'
      - 'admin-phone-*.js'
      - 'admin-phone-*.css'
      - 'admin-workspace.*'
      - 'admin.html'
      - 'admin-features.js'
      - 'scripts/build_pages.py'
      - 'scripts/build_admin_icons.py'
      - 'tests/admin_phone_browser.py'
      - 'tests/admin_account_access_browser.py'
      - 'tests/test_office_release_production.mjs'
      - '.github/workflows/office-production-release.yml'
  push:
    branches: [release/office-pwa-20261025]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  office-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify this candidate preserves Production data and identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor origin/main HEAD
          git diff --exit-code origin/main HEAD -- release.json CNAME push-config.json manifest.webmanifest data/ push-server/ .github/workflows/pages.yml
      - name: Verify production and Office script syntax
        run: |
          node --check admin-phone-v2.js
          node --check admin-phone-nav.js
          node --check admin-workspace.js
          node --check admin-features.js
          node --check admin-app/register.js
          node --check admin-app/sw.js
          python -m py_compile scripts/build_pages.py scripts/build_admin_icons.py
      - name: Build release candidate (no Production deploy)
        run: python scripts/build_pages.py
      - name: Audit PWA, version, security and mobile integrations
        run: node --test tests/test_office_release_production.mjs
      - name: Validate existing Production release requirements
        run: python scripts/release_preflight.py --channel production
      - name: Install Chromium
        run: |
          python -m pip install -q playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check real mobile PWA and sidebar geometry
        run: |
          python tests/admin_form_nav_browser.py
          python tests/admin_phone_browser.py
