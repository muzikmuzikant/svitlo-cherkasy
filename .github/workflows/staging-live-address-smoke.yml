name: Verify live Beta site address catalogue
on:
  push:
    branches: [staging]
    paths:
      - .github/workflows/staging-live-address-smoke.yml
      - data/addresses.json
      - data/street_catalog.json
      - data/street_aliases.json
      - data/published_street_fallback.json
      - app.js
      - address-lookup.js
      - data-merge.js
      - release.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify real Cloudflare Beta origin after deployment
        env:
          BETA_URL: https://svitlo-cherkasy.pages.dev
        run: |
          python - <<'PY'
          import json,os,time,urllib.request,urllib.error
          base=os.environ['BETA_URL']
          paths=['release.json','data/addresses.json','data/street_catalog.json',
                 'data/published_street_fallback.json','data/street_aliases.json','app.js','address-lookup.js']
          headers={'User-Agent':'SvitloCherkasy-Beta-Smoke/1.0','Cache-Control':'no-cache'}
          last=''
          for attempt in range(1,23):
              try:
                  values={}
                  for name in paths:
                      url=base+'/'+name+'?address_audit='+str(attempt)+'_'+str(time.time_ns())
                      req=urllib.request.Request(url,headers=headers)
                      with urllib.request.urlopen(req,timeout=12) as result:
                          payload=result.read(2_500_000)
                      values[name]=payload.decode('utf-8')
                  release=json.loads(values['release.json'])
                  address=json.loads(values['data/addresses.json'])
                  supplement=json.loads(values['data/street_catalog.json'])
                  seed=json.loads(values['data/published_street_fallback.json'])
                  aliases=json.loads(values['data/street_aliases.json'])
                  assert release.get('channel')=='beta', 'Not Beta channel'
                  assert tuple(map(int,release['version'].split('.'))) >= (7,9,14), 'Stale Beta deployment'
                  assert 'street_catalog.json' in values['app.js'], 'App missing merged catalogue'
                  assert 'street_aliases.json' in values['app.js'], 'Beta app missing renamed-street data'
                  assert 'splitHint' in values['address-lookup.js'], 'No safe split-street lookup'
                  assert 'withPrefixSpaces' in values['address-lookup.js'], 'No malformed prefix normalization'
                  assert 'hasPublishedQueue' in values['address-lookup.js'], 'Street rename queue matching missing'
                  assert 'verifiedRename' in values['address-lookup.js'], 'Street queue source metadata missing'
                  assert 'verifiedNameVariant' in values['address-lookup.js'], 'Short/full-name queue resolver not deployed'
                  assert len(aliases.get('spellingVariants',{}).get('черкаси',[]))>=19, 'Operator abbreviations have not deployed'
                  assert address['streetQueues']['вулиця|самброса']==['1.1','3.1','4.1'], 'Published Am brosa source queue data missing'
                  assert 'cleanStreetLabel' in values['address-lookup.js'], 'No duplicate publisher label cleanup'
                  assert len(aliases.get('localities',{}).get('черкаси',[]))>=119, 'Renamed streets have not deployed'
                  assert any(p['oldName']=='вулиця Генерала Путейка' and p['newName']=='вулиця Івана Кожедуба' for p in aliases['localities']['черкаси'])
                  assert address['streetQueues']['вулиця|короленка']==['2.1'], 'Official historic Korolenka queue missing'
                  assert address['keys']['вулиця|короленка|10']==['2.1'], 'Actual historic house record missing'
                  assert address['streetQueues']['провулок|гастелло']==['3.1'], 'Historic Hastello queue missing'
                  assert address['streetQueues']['провулок|атамановського']==['1.1'], 'Historic Atamanovskoho queue missing'
                  assert any(p['oldName']=='вулиця Короленка' and p['newName']=='вулиця Володимира Мономаха' for p in aliases['localities']['черкаси']), 'Historical Monomakh linkage missing'
                  assert seed['streets']['вулиця|іванакожедуба']=='Вулиця Івана Кожедуба'
                  assert seed['localities']['слобода']['streets']['вулиця|філатова']=='Вулиця Філатова'
                  assert len(address.get('streets',{}))>=425, 'Stale official importer'
                  assert len(supplement.get('streets',{}))>=511, 'Stale GIS importer'
                  assert sum(len(v.get('streets',{})) for v in supplement.get('localities',{}).values())>=480, 'Stale village GIS/OSM enrichment'
                  print('Verified live Beta: v'+release['version'])
                  print('Verified address names: official city',len(address['streets']),
                        'GIS city',len(supplement['streets']))
                  print('Verified Filatova and Ivana Kozheduba on actual Beta origin')
                  print('Verified municipal old/new street names:',len(aliases['localities']['черкаси']))
                  print('Verified geo-located village street names:',sum(len(v.get('streets',{})) for v in supplement['localities'].values()))
                  break
              except Exception as error:
                  last=str(error)
                  print(f'Attempt {attempt}: {last}',flush=True)
                  time.sleep(12)
          else:
              raise SystemExit('Beta not proven live: '+last)
          PY
