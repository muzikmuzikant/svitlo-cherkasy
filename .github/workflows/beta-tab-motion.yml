name: Beta 460ms Tab Motion Regression
on:
  pull_request:
    branches: [staging]
    paths: ['app.js', 'tests/test_agreed_tab_motion.mjs', '.github/workflows/beta-tab-motion.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --test tests/test_agreed_tab_motion.mjs
