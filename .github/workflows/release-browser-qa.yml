name: 7.9.12 Production Candidate Browser QA
on:
  push:
    branches: [release/7.9.12-integrated-20261024]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release-browser-qa.yml'
      - 'app.js'
      - 'sw.js'
      - 'index.html'
      - 'style.css'
      - 'theme.css'
      - 'theme.js'
      - 'scripts/build_pages.py'
      - 'tests/*_browser.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build release candidate PWA without deploying
        run: python scripts/build_pages.py
      - name: Validate Production routing, Push identity and SW cache
        run: python scripts/release_preflight.py --channel production
      - name: Install isolated Chromium for PWA testing
        run: |
          python -m pip install -q playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Cold-start installed PWA and reopen offline
        run: python tests/offline_pwa_browser.py
      - name: Verify all in-app pages online and offline
        run: python tests/internal_pages_browser.py
      - name: Check Android touch navigation and dark mode
        run: python tests/android_pwa_browser.py
      - name: Check dark mode, iPhone dock and appearance
        run: python tests/theme_browser.py
      - name: Check secondary dark-theme pages
        run: python tests/dark_secondary_pages_browser.py
      - name: Check inbox controls and zoom prevention
        run: python tests/inbox_toolbar_browser.py
      - name: Validate admin with a mock server, without touching live users
        run: python tests/admin_office_browser.py
