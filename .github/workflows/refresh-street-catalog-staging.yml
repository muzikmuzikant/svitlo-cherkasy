name: Refresh street catalogue for beta
on:
  push:
    branches: [staging]
    paths:
      - scripts/build_street_catalog.py
      - .github/workflows/refresh-street-catalog-staging.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: svitlo-staging-street-catalog
  cancel-in-progress: false
jobs:
  streets:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_street_catalog_beta.py
      - name: Read city GIS and OSM street names
        run: python scripts/build_street_catalog.py
      - name: Print coverage by locality
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/street_catalog.json').read_text('utf-8'))
          print('Cherkasy city street names:',len(d.get('streets',{})))
          for town, entry in sorted(d.get('localities',{}).items()):
              print(town, len(entry.get('streets',{})))
          PY
      - name: Publish beta catalogue without queues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "svitlo-address-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/street_catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Update beta street name catalogue"
            git pull --rebase origin staging
            git push origin HEAD:staging
          fi
