name: Code and Data Checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - run: node --test tests/*.cjs tests/*.mjs
      - run: node --check app.js && node --check admin.js && node --check install.js && node --check sw.js && node --check push-server/server.js && node --check push-server/admin.js
