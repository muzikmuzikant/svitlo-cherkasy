name: Staging address coverage and safety checks
on:
  push:
    branches:
      - fix/staging-complete-addresses-20261020
      - staging
  pull_request:
    branches:
      - staging
permissions:
  contents: read
jobs:
  address-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt pytest
      - name: Verify locality PDF extraction and GIS parser
        run: python -m pytest -q tests/test_district_import.py tests/test_published_fallback.py tests/test_address_catalog_v793.py tests/test_street_catalog_beta.py
      - name: Verify address search with independent source
        run: node --test tests/test_staging_address_regression.mjs tests/test_staging_renamed_streets.mjs tests/test_address_lookup.cjs tests/test_data_merge_v720.cjs tests/test_real_village_lookup.cjs
      - name: Build actual offline PWA
        run: python scripts/build_pages.py
      - name: Verify syntactic correctness
        run: node --check app.js && node --check address-lookup.js && node --check data-merge.js && node --check sw.js
