name: All Queues real browser motion QA
on:
  push:
    branches: [main]
    paths:
      - 'all-queues.js'
      - 'all-queues.css'
      - 'motion.css'
      - 'bottom-sheet.js'
      - 'site-mode.js'
      - 'admin-features.js'
      - 'push-server/app-config.js'
      - 'sw.js'
      - 'tests/queues_sheet_motion_browser.py'
      - '.github/workflows/queues-motion-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  all-queues-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build isolated Production PWA (no deploy or live requests)
        run: python scripts/build_pages.py
      - name: Install Chromium browser
        run: |
          python -m pip install -q playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify full-screen opening, closing, Escape and swipe
        run: python tests/queues_sheet_motion_browser.py
