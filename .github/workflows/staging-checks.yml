name: Check private Beta branch
on:
  push:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging identity and no production push configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('release.json').read_text())
          manifest=json.loads(Path('manifest.webmanifest').read_text())
          push=json.loads(Path('push-config.json').read_text())
          import re
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', release['version'])
          assert release['channel']=='beta'
          assert 'Beta' in manifest['name']
          assert 'svitlo-cherkasy-production.up.railway.app' not in push.get('apiBase','')
          assert isinstance(push.get('publicKey',''),str)
          PY
      - run: python scripts/build_pages.py
      - name: Check staged site output
        run: |
          python - <<'PY'
          from pathlib import Path
          assert not Path('_site/CNAME').exists()
          assert '-beta' in Path('_site/sw.js').read_text()
          assert 'Світло Beta' in Path('_site/manifest.webmanifest').read_text()
          assert 'BETA' in Path('_site/index.html').read_text()
          PY
      - name: Check all Beta additions and server syntax
        run: |
          node --check app.js && node --check install.js && node --check sw.js
          node --check beta-ads.js && node --check admin-ads.js
          node --check push-server/server.js && node --check push-server/admin.js && node --check push-server/ads.js
          test -f _site/beta-ads.js && test -f _site/admin-ads.js
          test -f _site/advertising.html && test -f _site/support-project.html
      - name: Run Beta advertising contract tests
        run: node --test tests/test_beta_monetization.mjs
