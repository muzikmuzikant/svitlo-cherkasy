name: Check private Beta branch
on:
  push:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging identity and no production push configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('release.json').read_text())
          manifest=json.loads(Path('manifest.webmanifest').read_text())
          push=json.loads(Path('push-config.json').read_text())
          import re
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', release['version'])
          assert release['channel']=='beta'
          assert 'beta' in manifest['id'].lower()
          assert 'svitlo-cherkasy-production.up.railway.app' not in push.get('apiBase','')
          assert isinstance(push.get('publicKey',''),str)
          PY
      - run: python scripts/build_pages.py
      - name: Check staged site output
        run: |
          python - <<'PY'
          from pathlib import Path
          assert not Path('_site/CNAME').exists()
          assert '-beta' in Path('_site/sw.js').read_text()
          assert 'Світло Черкаси' in Path('_site/manifest.webmanifest').read_text()
          assert 'BETA' in Path('_site/index.html').read_text()
          PY
      - name: Check all Beta additions and server syntax
        run: |
          node --check version-check.js && node --check site-mode.js && node --check admin-control.js && node --check push-server/app-config.js && node --check app.js && node --check client-errors.js && node --check admin-errors.js && node --check install.js && node --check sw.js
          node --check beta-ads.js && node --check motion.js && node --check admin-extra.js && node --check admin-ads.js && node --check internal-pages.js && node --check admin-users.js && node --check admin-reports.js && node --check admin-workspace.js && node --check admin-schedule-diff.js && node --check admin-quality.js && node --check admin-categories.js && node --check feedback.js && node --check legal-consent.js && node --check admin-legal.js
          node --check admin-system.js && node --check admin-address.js && node --check admin-office.js && node --check push-server/work-registry.js && node --check admin-source-review.js && node --check push-server/schedule-review.js && node --check push-server/schedule-publication.js && node --check push-server/server.js && node --check push-server/public-message.js && node --check push-server/admin.js && node --check push-server/ads.js && node --check push-server/admin-users.js && node --check push-server/daily-reports.js && node --check push-server/diagnostics.js && node --check push-server/legal-store.js && node --check push-server/schedule-quality.js
          test -f _site/admin-office.js && test -f _site/admin-office.css && test -f _site/admin-system.js && test -f _site/admin-system.css && test -f _site/admin-address.js && test -f _site/admin-address.css && test -f _site/admin-source-review.js && test -f _site/motion.js && test -f _site/motion.css && test -f _site/beta-ads.js && test -f _site/admin-ads.js && test -f _site/admin-users.js && test -f _site/internal-pages.js
          test -f _site/ad-detail.html && test -f _site/advertising.html && test -f _site/support-project.html
      - name: Validate official source parser syntax
        run: python -m py_compile scripts/update_data.py scripts/railway_schedule_cron.py
      - name: Verify Railway work registry persistence
        run: node --test tests/test_admin_work_registry.mjs tests/test_admin_office.mjs tests/test_admin_address_corrections.mjs tests/test_admin_address_ui.mjs
      - name: Run Beta advertising contract tests
        run: node --test tests/test_schedule_review_beta.mjs tests/test_tomorrow_dedupe_beta.mjs tests/test_push_options_7911.mjs tests/test_one_time_analytics_consent.mjs tests/test_notice_metrics_7911.mjs tests/test_manual_notice_update_badge.mjs tests/test_beta_799_live.mjs tests/test_pwa_updates.mjs tests/test_beta_monetization.mjs tests/test_admin_users_beta.mjs tests/test_legal_revision_beta.mjs tests/test_schedule_quality_beta.mjs tests/test_manual_push.mjs tests/test_feedback.mjs tests/test_diagnostics_beta.mjs tests/test_daily_reports_beta.mjs tests/test_beta_ui_regressions.mjs tests/test_motion_beta.mjs tests/test_offline_readiness_beta.mjs
      - name: Verify calendar-week retention and Beta schedule mirror
        run: |
          node --test tests/test_week_crossing_v713.mjs tests/test_schedule_mirror_beta.mjs tests/test_weekday_inbox_beta.mjs tests/test_release_fixes_7912.mjs
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q tests/test_weekly_schedule_retention_beta.py
      - name: Verify published beta API read-only route
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://svitlo-beta-api-staging.up.railway.app/api/ads'
          request=urllib.request.Request(url,headers={'Origin':'https://svitlo-cherkasy.pages.dev','Accept':'application/json'})
          with urllib.request.urlopen(request,timeout=15) as response:
              data=json.loads(response.read().decode('utf-8'))
              assert response.status==200
          assert isinstance(data.get('campaigns'),list), 'Campaigns API unavailable'
          assert isinstance(data.get('contacts'),list), 'Contact configuration unavailable'
          assert isinstance(data.get('support'),dict), 'Donation config unavailable'
          base='https://svitlo-beta-api-staging.up.railway.app'
          def get_json(endpoint):
              req=urllib.request.Request(base+endpoint,headers={'Origin':'https://svitlo-cherkasy.pages.dev','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=15) as resp:
                  assert resp.status==200
                  assert resp.headers.get('Access-Control-Allow-Origin')=='https://svitlo-cherkasy.pages.dev'
                  return json.loads(resp.read().decode('utf-8'))
          current=get_json('/api/data/schedules.json')
          verified=[day for day in current.get('days',[]) if day.get('verified') and day.get('date')]
          assert verified, 'No verified Beta schedule for message preview smoke'
          from urllib.parse import quote
          shared_id='day:6.1:'+verified[-1]['date']
          shared=get_json('/api/public/message?id='+quote(shared_id,safe=''))
          assert shared['id']==shared_id and shared['kind']=='schedule', 'Cross-queue public deep-link failed'
          assert '6.1' in shared['body']
          print('Beta API and verified deep-link endpoint ready (read-only)')
          PY
