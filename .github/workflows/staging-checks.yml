name: Check private Beta branch
on:
  push:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify staging identity and no production push configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('release.json').read_text())
          manifest=json.loads(Path('manifest.webmanifest').read_text())
          push=json.loads(Path('push-config.json').read_text())
          import re
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', release['version'])
          assert release['channel']=='beta'
          assert 'beta' in manifest['id'].lower()
          assert 'svitlo-cherkasy-production.up.railway.app' not in push.get('apiBase','')
          assert isinstance(push.get('publicKey',''),str)
          PY
      - run: python scripts/build_pages.py
      - name: Check staged site output
        run: |
          python - <<'PY'
          from pathlib import Path
          assert not Path('_site/CNAME').exists()
          assert '-beta' in Path('_site/sw.js').read_text()
          assert 'Світло Черкаси' in Path('_site/manifest.webmanifest').read_text()
          assert 'BETA' in Path('_site/index.html').read_text()
          PY
      - name: Check all Beta additions and server syntax
        run: |
          node --check app.js && node --check client-errors.js && node --check admin-errors.js && node --check app-info.js && node --check install.js && node --check sw.js
          node --check beta-ads.js && node --check admin-ads.js && node --check internal-pages.js && node --check admin-users.js && node --check admin-workspace.js && node --check admin-schedule-diff.js && node --check admin-quality.js && node --check admin-categories.js && node --check feedback.js && node --check legal-consent.js && node --check admin-legal.js
          node --check push-server/server.js && node --check push-server/admin.js && node --check push-server/ads.js && node --check push-server/admin-users.js && node --check push-server/diagnostics.js && node --check push-server/legal-store.js && node --check push-server/schedule-quality.js
          test -f _site/beta-ads.js && test -f _site/admin-ads.js && test -f _site/admin-users.js && test -f _site/internal-pages.js
          test -f _site/ad-detail.html && test -f _site/advertising.html && test -f _site/support-project.html
      - name: Run Beta advertising contract tests
        run: node --test tests/test_beta_monetization.mjs tests/test_admin_users_beta.mjs tests/test_legal_revision_beta.mjs tests/test_schedule_quality_beta.mjs tests/test_manual_push.mjs tests/test_feedback.mjs tests/test_diagnostics_beta.mjs
      - name: Verify published beta API read-only route
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://svitlo-beta-api-staging.up.railway.app/api/ads'
          request=urllib.request.Request(url,headers={'Origin':'https://svitlo-cherkasy.pages.dev','Accept':'application/json'})
          with urllib.request.urlopen(request,timeout=15) as response:
              data=json.loads(response.read().decode('utf-8'))
              assert response.status==200
          assert isinstance(data.get('campaigns'),list), 'Campaigns API unavailable'
          assert isinstance(data.get('contacts'),list), 'Contact configuration unavailable'
          assert isinstance(data.get('support'),dict), 'Donation config unavailable'
          print('Beta API ready, no mutation or production request')
          PY
