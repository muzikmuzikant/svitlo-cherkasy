name: Refresh emergency bulletins
on:
  workflow_dispatch:
  schedule:
    - cron: '4,19,34,49 * * * *'
permissions:
  contents: write
concurrency:
  group: svitlo-data-refresh
  cancel-in-progress: false
jobs:
  emergency:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Check official operator emergency notices
        run: python scripts/update_data.py --emergency-only
      - name: Publish verified changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'svitlo-data-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/emergency.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified emergency operator notices'
            git pull --rebase origin main
            git push origin HEAD:main
            # GITHUB_TOKEN pushes do not trigger GitHub Pages builds automatically.
            # Request a deployment only after actual verified data changes.
            gh api repos/${{ github.repository }}/dispatches -f event_type=svitlo-data-updated
          fi
